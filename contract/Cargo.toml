[package]
name = "web3edu-near-contract"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "5.30.0", features = ["legacy"] }
borsh = "1.0"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["legacy", "unit-testing"] }

[features]
default = []
